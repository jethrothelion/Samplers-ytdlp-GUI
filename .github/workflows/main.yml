name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: java --version

      - name: Compile
        run: javac -d bin src/*.java

      - name: Strip platform-specific binaries
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            rm -f bin/ffmpeg bin/yt-dlp
          else
            rm -f bin/*.exe
          fi

      - name: Build jar
        run: jar --create --file MyApp.jar --main-class Main -C bin .

      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix

      - name: Package with jpackage (Linux)
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --input . \
            --name MyApp \
            --main-jar MyApp.jar \
            --main-class Main \
            --icon icons/icon.png \
            --type app-image \
            --dest dist

      - name: Package with jpackage (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage `
            --input . `
            --name MyApp `
            --main-jar MyApp.jar `
            --main-class Main `
            --icon icons/icon.ico `
            --type exe `
            --dest dist

      - name: Zip package
        run: |
          cd dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a ../MyApp-${{ runner.os }}.zip *.exe
          else
            zip -r ../MyApp-${{ runner.os }}.zip MyApp
          fi
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-${{ runner.os }}
          path: MyApp-${{ runner.os }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
