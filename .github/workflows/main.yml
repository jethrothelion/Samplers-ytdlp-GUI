name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: java --version

      - name: Get version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.1" >> "$GITHUB_ENV"
          fi

      - name: Compile
        run: javac -d classes src/*.java

      - name: Fetch yt-dlp and ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin
          curl -fL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp
          curl -fL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz --strip-components=2 -C bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          rm ffmpeg.tar.xz
          chmod +x bin/yt-dlp bin/ffmpeg bin/ffprobe

      - name: Fetch yt-dlp and ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p bin
          curl -fL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o bin/yt-dlp.exe
          curl -fL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -o ffmpeg.zip
          unzip -q -j ffmpeg.zip '*/bin/ffmpeg.exe' '*/bin/ffprobe.exe' -d bin
          rm ffmpeg.zip

      - name: Build jar and stage app files
        run: |
          mkdir -p package
          cp assets/*.png classes/
          cp -r themes package/
          cp bin/* package/
          jar --create --file package/Yt-DLP-GUI"$APP_VERSION".jar --main-class Main -C classes .



      - name: Upload portable artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Yt-DLP-GUI-jar
          path: package/Yt-DLP-GUI.jar

      - name: Install WiX
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Package with jpackage (Linux)
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --input package \
            --name Yt-DLP-GUI \
            --main-jar Yt-DLP-GUI.jar \
            --main-class Main \
            --app-version "$APP_VERSION" \
            --icon assets/YtDlp-GUI.png \
            --type deb \
            --dest dist \
            --vendor jethrothelion \
            --description "Video downloader, works on youtube or other online videos" \
            --linux-package-name yt-dlp-gui \
            --linux-shortcut \
            --linux-menu-group AudioVideo \
            --license-file LICENSE 

      - name: Package with jpackage (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage \
            --input package \
            --name Yt-DLP-GUI \
            --main-jar Yt-DLP-GUI.jar \
            --main-class Main \
            --app-version "$APP_VERSION" \
            --icon assets/YtDlp-GUI.ico \
            --vendor jethrothelion \
            --description "Video downloader, works on youtube or other online videos" \
            --type exe \
            --dest dist \
            --win-shortcut \
            --win-menu \
            --win-shortcut-prompt \
            --license-file LICENSE 

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yt-DLP-GUI-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    # Only publish for tag pushes; manual runs just build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what we got
        run: ls -la artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*.jar
