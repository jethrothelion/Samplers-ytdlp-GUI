name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: java --version

      - name: Compile
        run: javac -d bin src/*.java

        
      - name: Fetch yt-dlp and ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp
          curl -L https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz --strip-components=2 -C bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          rm ffmpeg.tar.xz
          chmod +x bin/yt-dlp bin/ffmpeg bin/ffprobe

      - name: Fetch yt-dlp and ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o bin/yt-dlp.exe
          curl -L https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -o ffmpeg.zip
          unzip -q -j ffmpeg.zip '*/bin/ffmpeg.exe' '*/bin/ffprobe.exe' -d bin
          rm ffmpeg.zip

      - name: Build jar
        run: jar --create --file Yt-DLP-GUI.jar --main-class Main -C bin .

      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix

      - name: Package with jpackage (Linux)
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --input . \
            --name Yt-DLP-GUI \
            --main-jar Yt-DLP-GUI.jar \
            --main-class Main \
            --icon assets/YtDlp-GUI.png \
            --type app-image \
            --dest dist \
            --vendor jethrothelion \
            --description Video downloader, works on youtube or other online videos
            --linux-package-name YTDLP-GUI \
            --linux-shortcut \
            --linux-menu-group Music \
            

      - name: Package with jpackage (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage `
            --input . `
            --name Yt-DLP-GUI `
            --main-jar Yt-DLP-GUI.jar `
            --main-class Main `
            --icon assets/YtDlp-GUI.ico `
            --vendor jethrothelion `
            --description Video downloader, works on youtube or other online video` `
            --type exe `
            --dest dist `
            --app-version `
            --win-shortcut `
            --win-menu `
            --win-shortcut-prompt
            
            
            
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-${{ runner.os }}
          path: MyApp-${{ runner.os }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe or artifacts/**/*.deb or artifacts/**/*.appimage
