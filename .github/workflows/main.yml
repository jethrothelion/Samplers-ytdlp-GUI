name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: java --version

      - name: Compile
        run: javac -d bin src/*.java

      - name: Strip platform-specific binaries
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            rm -f bin/ffmpeg bin/yt-dlp
          else
            rm -f bin/*.exe
          fi

      - name: Build jar
        run: jar --create --file Yt-DLP-GUI.jar --main-class Main -C bin .

      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix

      - name: Package with jpackage (Linux)
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --input . \
            --name Yt-DLP-GUI \
            --main-jar Yt-DLP-GUI.jar \
            --main-class Main \
            --icon assets/YtDlp-GUI.png \
            --type app-image \
            --dest dist \
            --vendor jethrothelion \
            --description Video downloader, works on youtube or other online videos
            --linux-package-name YTDLP-GUI \
            --linux-shortcut \
            --linux-menu-group Music \
            

      - name: Package with jpackage (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage `
            --input . `
            --name Yt-DLP-GUI `
            --main-jar Yt-DLP-GUI.jar `
            --main-class Main `
            --icon assets/YtDlp-GUI.ico `
            --vendor jethrothelion `
            --description Video downloader, works on youtube or other online video` `
            --type exe `
            --dest dist `
            --app-version `
            --win-shortcut `
            --win-menu `
            --win-shortcut-prompt
            
            
            
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-${{ runner.os }}
          path: MyApp-${{ runner.os }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe or artifacts/**/*.deb or artifacts/**/*.appimage
